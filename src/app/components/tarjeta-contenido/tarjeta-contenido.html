<div class="card" style="width: 18rem;">
  <img [src]="contenido.image" class="card-img-top" alt="carátula contenido">
  <div class="card-body">
    <h5 class="card-title">{{contenido.title}}</h5>
    <p class="card-text">{{contenido.year}} - {{contenido.platform}}</p>
    <a (click)="llamaAlPadre()" class="btn btn-primary">Go somewhere</a>
  </div>
</div>
